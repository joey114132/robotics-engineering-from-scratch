name: checks
on:
  push:
  pull_request:
jobs:
  lessons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/check_lessons.py
      - run: python -m pytest phases scripts/tests_robo -q
